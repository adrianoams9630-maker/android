<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem conexão</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0D0D0F;color:#EDEDED;font-family:system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  .b{max-width:320px}
  h1{font-size:20px;margin:16px 0 8px}
  p{color:#9A9AA2;font-size:15px;line-height:1.5;margin:0 0 24px}
  button{background:#C0183C;color:#fff;border:0;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:600;width:100%}
  .ic{width:56px;height:56px;border-radius:50%;background:#1C1C21;display:inline-flex;align-items:center;justify-content:center;font-size:28px}
  small{display:block;margin-top:20px;color:#6A6A72;font-size:13px}
</style></head>
<body><div class="b">
  <div class="ic">📡</div>
  <h1>Sem conexão</h1>
  <p>Não foi possível abrir o app agora. Se a viagem já começou, o GPS continua sendo registrado e será enviado quando o sinal voltar.</p>
  <button onclick="window.VHCNative ? VHCNative.reload() : location.reload()">Tentar novamente</button>
  <small id="f"></small>
</div>
<script>
  try { if (window.VHCNative && VHCNative.isTracking()) {
    var n = VHCNative.pendingCount();
    document.getElementById('f').textContent = 'Rastreio ativo' + (n ? ' · ' + n + ' ponto(s) aguardando envio' : '');
  } } catch(e) {}
  window.addEventListener('online', function(){ window.VHCNative ? VHCNative.reload() : location.reload(); });
</script>
</body></html>
