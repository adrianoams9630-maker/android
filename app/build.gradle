plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.oestecargas.conferencia'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.oestecargas.conferencia'
        minSdk 26
        targetSdk 35
        // Número do build do GitHub Actions vira a versão (atualiza por cima da anterior)
        versionCode((project.findProperty('vc') ?: '1') as int)
        versionName "1.0.${project.findProperty('vc') ?: '0'}"
        // Endereço do painel (pode ser trocado no app: "Configurar servidor" na tela de login)
        buildConfigField 'String', 'URL_PADRAO', '"https://n8n.paideguasistema.com.br/webhook/oeste-cargas-conf-manifesto"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        fixa {
            // Chave fixa vinda dos secrets do GitHub (CONF_KEYSTORE_BASE64 / CONF_KEYSTORE_PASSWORD)
            def ks = file('release.keystore')
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('CONF_KEYSTORE_PASSWORD')
                keyAlias 'conferencia'
                keyPassword System.getenv('CONF_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file('release.keystore').exists() ? signingConfigs.fixa : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Leitor de código de barras do Google Play Services (não precisa de permissão de câmera)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
