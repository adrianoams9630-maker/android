name: APK Motorista (offline)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TEM_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Gerar projeto Android (se não estiver versionado)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      # Ícone (adaptativo + legado) e splash da Oeste Cargas a partir de assets/
      - name: Gerar ícone e splash
        run: npm run android:assets

      - name: Sincronizar www + plugins e ajustar manifest
        env:
          APP_VERSION_CODE: ${{ github.run_number }}0
          APP_VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          npx cap sync android
          node scripts/patch-android.js

      # Assinatura: com os secrets configurados, gera APK release assinado
      # com a MESMA chave de sempre (obrigatório para o celular aceitar
      # como atualização). Sem os secrets, gera APK debug.
      - name: Preparar keystore
        if: env.TEM_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.keystore

      - name: Build release assinado
        if: env.TEM_KEYSTORE == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password='${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            -Pandroid.injected.signing.key.alias='${{ secrets.ANDROID_KEY_ALIAS }}' \
            -Pandroid.injected.signing.key.password='${{ secrets.ANDROID_KEY_PASSWORD }}'

      - name: Build debug
        if: env.TEM_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-motorista-offline
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
