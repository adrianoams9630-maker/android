name: APK VHC Motorista

on:
  push:
    branches: [ vhc-motorista ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VHC_KEYSTORE_PASSWORD: ${{ secrets.VHC_KEYSTORE_PASSWORD }}
      TEM_KEYSTORE: ${{ secrets.VHC_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Opcional: com os secrets VHC_KEYSTORE_BASE64 / VHC_KEYSTORE_PASSWORD assina com chave privada.
      # Sem eles usa app/vhc-estavel.keystore (sempre a mesma → atualizações instalam por cima).
      - name: Preparar chave privada
        if: env.TEM_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.VHC_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > app/release.keystore

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/release/*.apk VHC-Motorista.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VHC-Motorista-apk
          path: VHC-Motorista.apk
          if-no-files-found: error

      # Release com tag fixa: o link de download nunca muda
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vhc-motorista-latest --cleanup-tag -y || true
          gh release create vhc-motorista-latest VHC-Motorista.apk \
            --target "$GITHUB_SHA" \
            --title "VHC Motorista 1.0.${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }}. Baixar: https://github.com/${{ github.repository }}/releases/download/vhc-motorista-latest/VHC-Motorista.apk" \
            --latest=false
