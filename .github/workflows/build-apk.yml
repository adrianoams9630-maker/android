name: APK Conferência MDF-e

on:
  push:
    branches: [ conferencia-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CONF_KEYSTORE_PASSWORD: ${{ secrets.CONF_KEYSTORE_PASSWORD }}
      TEM_KEYSTORE: ${{ secrets.CONF_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Com os secrets CONF_KEYSTORE_BASE64 / CONF_KEYSTORE_PASSWORD o APK sai sempre com a
      # mesma chave e as versões novas instalam por cima. Sem eles, usa chave de debug.
      - name: Preparar chave fixa
        if: env.TEM_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.CONF_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > app/release.keystore

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/release/*.apk Conferencia-MDFe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Conferencia-MDFe-apk
          path: Conferencia-MDFe.apk
          if-no-files-found: error

      # Release com tag fixa: o link de download nunca muda
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete conferencia-latest --cleanup-tag -y || true
          ASSINATURA=$([ "$TEM_KEYSTORE" = "true" ] && echo "chave fixa" || echo "chave de debug")
          gh release create conferencia-latest Conferencia-MDFe.apk \
            --target "$GITHUB_SHA" \
            --title "Conferência MDF-e 1.0.${{ github.run_number }}" \
            --notes "Build ${{ github.run_number }} — assinado com $ASSINATURA. Baixar: https://github.com/${{ github.repository }}/releases/download/conferencia-latest/Conferencia-MDFe.apk" \
            --latest=false
